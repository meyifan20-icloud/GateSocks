services:
  gatesocks:
    image: ghcr.io/meyifan20-icloud/gatesocks:latest-dev
    container_name: gatesocks
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - "127.0.0.1:19080:19080"
    expose:
      - "19080"
    environment:
      GATESOCKS_BIND: 0.0.0.0
      GATESOCKS_PORT: 19080
      GATESOCKS_VERSION: 0.4.0-dev
      GATESOCKS_CADDY_NETWORK: ${SUBLINK_NETWORK:-sublink-worker_default}
      GATESOCKS_ADMIN_USER: ${GATESOCKS_ADMIN_USER:-admin}
      GATESOCKS_ADMIN_PASS: ${GATESOCKS_ADMIN_PASS:?set GATESOCKS_ADMIN_PASS}
      GATESOCKS_SESSION_SECRET: ${GATESOCKS_SESSION_SECRET:?set GATESOCKS_SESSION_SECRET}
      GATESOCKS_SESSION_TTL: ${GATESOCKS_SESSION_TTL:-43200}
      GATESOCKS_COOKIE_SECURE: ${GATESOCKS_COOKIE_SECURE:-false}
      GATESOCKS_VPNGATE_URL: ${GATESOCKS_VPNGATE_URL:-https://www.vpngate.net/api/iphone/}
      GATESOCKS_VPNGATE_TIMEOUT: ${GATESOCKS_VPNGATE_TIMEOUT:-15}
      GATESOCKS_VPNGATE_MAX_NODES: ${GATESOCKS_VPNGATE_MAX_NODES:-500}
      GATESOCKS_SOCKS_START: 18001
      GATESOCKS_SOCKS_END: 18099
      GATESOCKS_TEST_START: 18100
      GATESOCKS_TEST_END: 18149
    volumes:
      - ./data:/app/data
      - ./config:/app/config
    networks:
      - sublink
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:19080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

networks:
  sublink:
    external: true
    name: ${SUBLINK_NETWORK:-sublink-worker_default}
