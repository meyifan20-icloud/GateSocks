services:
  gatesocks:
    image: ghcr.io/meyifan20-icloud/gatesocks:latest-dev
    container_name: gatesocks
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - "127.0.0.1:19080:19080"
      - "18001-18099:18001-18099/tcp"
    expose:
      - "19080"
    environment:
      GATESOCKS_BIND: 0.0.0.0
      GATESOCKS_PORT: 19080
      GATESOCKS_VERSION: 0.4.11-dev
      GATESOCKS_CADDY_NETWORK: ${SUBLINK_NETWORK:-sublink-worker_default}
      GATESOCKS_ADMIN_USER: ${GATESOCKS_ADMIN_USER:-admin}
      GATESOCKS_ADMIN_PASS: ${GATESOCKS_ADMIN_PASS:?set GATESOCKS_ADMIN_PASS}
      GATESOCKS_SESSION_SECRET: ${GATESOCKS_SESSION_SECRET:?set GATESOCKS_SESSION_SECRET}
      GATESOCKS_SESSION_TTL: ${GATESOCKS_SESSION_TTL:-43200}
      GATESOCKS_COOKIE_SECURE: ${GATESOCKS_COOKIE_SECURE:-false}
      GATESOCKS_VPNGATE_URL: ${GATESOCKS_VPNGATE_URL:-https://www.vpngate.net/api/iphone/}
      GATESOCKS_VPNGATE_TIMEOUT: ${GATESOCKS_VPNGATE_TIMEOUT:-15}
      GATESOCKS_VPNGATE_MAX_NODES: ${GATESOCKS_VPNGATE_MAX_NODES:-500}
      GATESOCKS_VPNGATE_USERNAME: ${GATESOCKS_VPNGATE_USERNAME:-vpn}
      GATESOCKS_VPNGATE_PASSWORD: ${GATESOCKS_VPNGATE_PASSWORD:-vpn}
      GATESOCKS_TEST_BATCH_LIMIT: ${GATESOCKS_TEST_BATCH_LIMIT:-5}
      GATESOCKS_TEST_MAX_BATCH: ${GATESOCKS_TEST_MAX_BATCH:-200}
      GATESOCKS_TEST_CONNECT_TIMEOUT: ${GATESOCKS_TEST_CONNECT_TIMEOUT:-30}
      GATESOCKS_TEST_DOWNLOAD_BYTES: ${GATESOCKS_TEST_DOWNLOAD_BYTES:-5000000}
      GATESOCKS_TEST_UPLOAD_BYTES: ${GATESOCKS_TEST_UPLOAD_BYTES:-1048576}
      GATESOCKS_SOCKS_CONNECT_TIMEOUT: ${GATESOCKS_SOCKS_CONNECT_TIMEOUT:-35}
      GATESOCKS_PUBLIC_HOST: ${GATESOCKS_PUBLIC_HOST:-}
      GATESOCKS_SOCKS_TABLE_BASE: ${GATESOCKS_SOCKS_TABLE_BASE:-20000}
      GATESOCKS_SOCKS_RULE_PRIORITY_BASE: ${GATESOCKS_SOCKS_RULE_PRIORITY_BASE:-21000}
      GATESOCKS_SOCKS_START: 18001
      GATESOCKS_SOCKS_END: 18099
      GATESOCKS_TEST_START: 18100
      GATESOCKS_TEST_END: 18149
    volumes:
      - ./data:/app/data
      - ./config:/app/config
    networks:
      - sublink
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:19080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

networks:
  sublink:
    external: true
    name: ${SUBLINK_NETWORK:-sublink-worker_default}
