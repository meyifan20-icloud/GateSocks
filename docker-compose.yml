services:
  gatesocks:
    image: ghcr.io/meyifan20-icloud/gatesocks:latest-dev
    container_name: gatesocks
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      GATESOCKS_BIND: 127.0.0.1
      GATESOCKS_PORT: 19080
      GATESOCKS_VERSION: 0.2.0-dev
      GATESOCKS_SOCKS_START: 18001
      GATESOCKS_SOCKS_END: 18099
      GATESOCKS_TEST_START: 18100
      GATESOCKS_TEST_END: 18149
    volumes:
      - ./data:/app/data
      - ./config:/app/config
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:19080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
